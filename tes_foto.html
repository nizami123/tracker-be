<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tes Upload Foto via API</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 14px;color:#222}
  h1{font-size:20px} label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
  input[type=text],select{width:100%;padding:8px;box-sizing:border-box;border:1px solid #bbb;border-radius:6px}
  button{margin-top:14px;padding:10px 18px;border:0;border-radius:6px;background:#1e90ff;color:#fff;font-size:15px;cursor:pointer}
  button:disabled{background:#999}
  #status{margin-top:16px;padding:10px;border-radius:6px;background:#f2f2f2;font-weight:600}
  .ok{background:#d8f5dc!important}.bad{background:#fbdada!important}
  pre{background:#111;color:#e6e6e6;padding:10px;border-radius:6px;overflow:auto;font-size:12px;max-height:380px}
  img{max-width:100%;border:1px solid #ccc;border-radius:6px;margin-top:8px}
  .hint{font-size:12px;color:#666}
</style>
</head>
<body>
<h1>Tes Upload Foto lewat API</h1>
<p class="hint">Mengirim foto ke <code>api/tes_upload</code> dengan cara yang sama seperti aplikasi (JSON + base64), tanpa login dan tanpa menulis ke database. <b>Hapus halaman ini dan Tes_upload.php setelah selesai.</b></p>

<label>URL endpoint API</label>
<input type="text" id="endpoint">

<label>Folder tujuan</label>
<select id="folder">
  <option value="attendance_photos">attendance_photos (foto absen / pengiriman)</option>
  <option value="request_attachments">request_attachments (lampiran pengajuan)</option>
</select>

<label>Pilih foto</label>
<input type="file" id="file" accept="image/jpeg,image/png,application/pdf">

<label>Batas tunggu (detik)</label>
<input type="text" id="timeout" value="60">

<button id="btnInfo" type="button" style="background:#666">Cek server (GET)</button>
<button id="btnSend" type="button">Upload</button>

<div id="status">Belum ada tes.</div>
<div id="preview"></div>
<h3>Respons server</h3>
<pre id="out">-</pre>

<script>
const $ = id => document.getElementById(id);
$('endpoint').value = location.href.replace(/[^\/]*$/, '') + 'api/tes_upload';

function setStatus(text, cls){ const s=$('status'); s.textContent=text; s.className=cls||''; }

function toBase64(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(String(r.result).split(',')[1]);
    r.onerror = () => rej(new Error('Gagal membaca file'));
    r.readAsDataURL(file);
  });
}

async function call(opts){
  const secs = Math.max(5, parseInt($('timeout').value, 10) || 60);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), secs * 1000);
  const t0 = performance.now();
  try {
    const r = await fetch($('endpoint').value, Object.assign({ signal: ctl.signal }, opts));
    const text = await r.text();
    const sec = ((performance.now() - t0) / 1000).toFixed(2);
    let json = null; try { json = JSON.parse(text); } catch(e){}
    return { http: r.status, text, json, sec };
  } catch (e) {
    const sec = ((performance.now() - t0) / 1000).toFixed(2);
    if (e.name === 'AbortError') return { error: 'TIDAK ADA RESPON setelah ' + sec + ' detik (batas ' + secs + ' dtk).', sec };
    return { error: 'Gagal terhubung: ' + e.message + ' (' + sec + ' dtk). Cek URL/HTTPS/CORS.', sec };
  } finally { clearTimeout(timer); }
}

function show(res){
  $('preview').innerHTML = '';
  if (res.error) { setStatus(res.error, 'bad'); $('out').textContent = res.error; return; }
  $('out').textContent = res.json ? JSON.stringify(res.json, null, 2) : res.text;
  const j = res.json;
  if (!j) { setStatus('HTTP ' + res.http + ' — balasan BUKAN JSON (' + res.sec + ' dtk). Lihat isi di bawah.', 'bad'); return; }
  if (j.success) {
    setStatus('BERHASIL — tersimpan di ' + j.tersimpan_di + ' (' + res.sec + ' dtk di browser, ' + (j.waktu_detik ? j.waktu_detik.total_server : '?') + ' dtk di server)', 'ok');
    if (j.url) $('preview').innerHTML = '<div class="hint">' + j.url + '</div><img src="' + j.url + '" alt="hasil" onerror="this.outerHTML=\'<div class=hint>Gambar tidak bisa dibuka dari URL tersebut (atau bukan gambar).</div>\'">';
  } else if (j.fatal) {
    setStatus('PHP FATAL di server: ' + j.fatal + ' (' + j.file + ':' + j.line + ')', 'bad');
  } else if (j.tersimpan_di) {
    setStatus('Upload ke hosting GAGAL: ' + j.tersimpan_di + ' — lihat upload_debug di bawah.', 'bad');
  } else if (j.info) {
    setStatus(j.info + ' (' + res.sec + ' dtk)', 'ok');
  } else {
    setStatus('HTTP ' + res.http + ': ' + (j.message || 'gagal'), 'bad');
  }
}

$('btnInfo').onclick = async () => {
  setStatus('Memeriksa server...'); show(await call({ method: 'GET' }));
};

$('btnSend').onclick = async () => {
  const f = $('file').files[0];
  if (!f) { setStatus('Pilih file dulu.', 'bad'); return; }
  $('btnSend').disabled = true;
  try {
    setStatus('Membaca file (' + (f.size/1024).toFixed(0) + ' KB)...');
    const b64 = await toBase64(f);
    setStatus('Mengirim ' + (b64.length/1024).toFixed(0) + ' KB (base64) ke API...');
    show(await call({
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photo_base64: b64, folder: $('folder').value, filename: f.name })
    }));
  } catch (e) { setStatus(e.message, 'bad'); }
  $('btnSend').disabled = false;
};
</script>
</body>
</html>
